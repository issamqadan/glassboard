[package]
name = "glassboard-server"
version = "0.1.0"
edition = "2021"
description = "Glassboard multiplayer server: engine-validated rooms over WebSocket (M5)."

[dependencies]
glassboard-engine = { path = "../core/engine" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
