name: Deploy to GitHub Pages

# Builds the WASM core and publishes the static web app to GitHub Pages.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
# Then every push to main redeploys. Live URL: https://<user>.github.io/glassboard

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "web/**"
      - "scripts/build-web.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Newest commit wins. This was `false`, which queues runs strictly — and on
  # 2026-10-06 a run sat in `waiting` for ~40 minutes and blocked the two deploys
  # behind it, so finished work sat undeployed with no way to drain the queue.
  # A static site has no partial-deploy problem worth protecting: whatever is on
  # main is what should be live, so superseding an older queued run is correct.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/**/Cargo.toml') }}

      - name: Install wasm-pack (prebuilt)
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build web bundle
        run: ./scripts/build-web.sh

      # GitHub Pages + CDN cache static assets aggressively, so a fresh deploy can
      # keep serving stale JS/WASM (a change that "didn't ship"). Stamp every local
      # asset URL with the commit SHA so each deploy is a distinct, uncached URL.
      - name: Cache-bust static assets
        run: |
          V="${GITHUB_SHA::8}"
          # Version marker the auto-updater fetches (uncached) to detect stale tabs.
          printf '%s' "$V" > web/version.txt
          for f in web/*.html; do
            sed -i -E \
              -e 's#(src="\./[^"]+\.js)"#\1?v='"$V"'"#g' \
              -e 's#(href="\./[^"]+\.css)"#\1?v='"$V"'"#g' "$f"
            sed -i "s/__GBVER__/$V/g" "$f"
          done
          sed -i -E 's#(from "\./pkg/glassboard_wasm\.js)"#\1?v='"$V"'"#' web/main.js web/multiplayer.js web/twoplayer.js web/engine-worker.js
          sed -i "s#new URL('glassboard_wasm_bg.wasm'#new URL('glassboard_wasm_bg.wasm?v=$V'#" web/pkg/glassboard_wasm.js
          # The engine Web Worker is loaded by URL from main.js — stamp that URL too.
          sed -i -E 's#(new URL\("\./engine-worker\.js)"#\1?v='"$V"'"#' web/main.js
          # Offline service worker — stamp the version so each deploy refreshes its cache.
          sed -i "s/__GBVER__/$V/g" web/sw.js
          echo "Cache-busted static assets with v=$V"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
