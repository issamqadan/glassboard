[package]
name = "glassboard-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the Glassboard engine core (M2)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glassboard-engine = { path = "../engine" }
wasm-bindgen = "0.2"

# Disable wasm-opt so the build never needs to download a binaryen binary
# (the prebuilt is not published for every host arch).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
